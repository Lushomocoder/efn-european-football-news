<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EFN | European Football Network</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #07100d;
  color: white;
}

a {
  color: inherit;
  text-decoration: none;
}

/* TOP BAR */
.topbar {
  background: #050806;
  color: #9ba8a2;
  font-size: 12px;
  padding: 9px 5%;
  display: flex;
  justify-content: space-between;
}

/* HEADER */
header {
  background: #08140f;
  border-bottom: 1px solid #1b3025;
}

.header {
  max-width: 1200px;
  margin: auto;
  height: 82px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-ball {
  width: 48px;
  height: 48px;
  border: 3px solid #00f26d;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.logo h1 {
  color: #00f26d;
  font-size: 31px;
  letter-spacing: -1px;
}

.logo p {
  font-size: 9px;
  letter-spacing: 2px;
  color: white;
  margin-top: 2px;
}

nav {
  display: flex;
  gap: 25px;
  font-size: 14px;
  font-weight: bold;
}

nav a:hover {
  color: #00f26d;
}

.search {
  border: 1px solid #294135;
  padding: 10px 13px;
  border-radius: 8px;
  font-size: 18px;
}

/* LEAGUE NAV */
.leagues {
  background: #0d1c15;
  border-bottom: 1px solid #1b3025;
  overflow-x: auto;
}

.leagues-inner {
  max-width: 1200px;
  margin: auto;
  display: flex;
}

.leagues a {
  padding: 14px 18px;
  white-space: nowrap;
  font-size: 12px;
  font-weight: bold;
  color: #bbc8c1;
}

.leagues a:hover {
  background: #00f26d;
  color: #06100a;
}

/* BREAKING */
.breaking {
  background: #00f26d;
  color: #031008;
  padding: 11px 5%;
  font-weight: bold;
  font-size: 13px;
}

.breaking span {
  background: #07120c;
  color: #00f26d;
  padding: 5px 8px;
  margin-right: 12px;
  border-radius: 4px;
  font-size: 10px;
}
