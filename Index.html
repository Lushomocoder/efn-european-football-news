<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EFN – European Football Network</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#10233f;
line-height:1.6;
}

header{
background:#071a33;
color:white;
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:25px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin-left:22px;
font-weight:bold;
}

nav a:hover{color:#f5c542}

.hero{
background:linear-gradient(135deg,#071a33,#0b63ce,#19a7ff);
color:white;
padding:90px 7%;
}

.hero h1{
font-size:clamp(40px,8vw,70px);
line-height:1;
margin-bottom:20px;
}

.hero p{
font-size:19px;
max-width:650px;
color:#e4f2ff;
}

.button{
display:inline-block;
margin-top:25px;
padding:13px 22px;
background:#f5c542;
color:#071a33;
text-decoration:none;
font-weight:bold;
border-radius:8px;
}

.container{
max-width:1150px;
margin:auto;
padding:50px 20px;
}

h2{
font-size:30px;
margin-bottom:25px;
}

.news{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 5px 20px #0001;
}

.card-top{
height:150px;
background:linear-gradient(135deg,#0b63ce,#19a7ff);
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
}

.card-content{
padding:20px;
}

.card-content h3{
margin:8px 0;
font-size:20px;
}

.card-content p{
color:#64748b;
}

.sections{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
margin-top:45px;
}

.panel{
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 5px 20px #0001;
}

.fixture{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid #eee;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px 7px;
text-align:left;
border-bottom:1px solid #eee;
}

color:#
